<!doctype html>
<!-- Source for assets/img/og-image.png (the link-preview card on LinkedIn, WhatsApp, X).
     Open at exactly 1200x630 and take a screenshot; see README.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG card</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
    body { position: relative; color: #f5f5f7; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    canvas { position: absolute; inset: 0; }
    .planet {
      position: absolute; left: 76%; top: 76%;
      width: 2600px; height: 2600px; border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 50% 0, #17171a 0, #08080a 7%, #000 22%);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 18px 50px -20px rgba(225,228,236,.28), 0 -1px 18px rgba(220,224,232,.25), 0 -30px 120px rgba(160,165,180,.16);
    }
    .content { position: absolute; left: 80px; top: 92px; }
    .eyebrow { display: flex; align-items: center; gap: 14px; font: 500 15px/1 'JetBrains Mono', monospace; letter-spacing: .34em; text-transform: uppercase; color: #c7c7cc; }
    .eyebrow::before { content: ''; width: 40px; height: 1px; background: rgba(255,255,255,.3); }
    h1 { margin: 22px 0 22px; font: 600 112px/.9 'Space Grotesk', sans-serif; letter-spacing: .035em; text-transform: uppercase; }
    h1 span { display: block; }
    .role { font: 500 17px/1.4 'Inter', sans-serif; letter-spacing: .34em; text-transform: uppercase; }
    .chips { position: absolute; left: 80px; bottom: 72px; display: flex; gap: 10px; }
    .chip { padding: 12px 16px; border: 1px solid rgba(255,255,255,.18); background: rgba(8,8,10,.6); font: 400 17px/1 'Inter', sans-serif; color: #c7c7cc; }
    .chip strong { font: 600 19px/1 'JetBrains Mono', monospace; color: #fff; margin-right: 6px; }
    .url { position: absolute; right: 80px; bottom: 84px; font: 500 16px/1 'JetBrains Mono', monospace; letter-spacing: .2em; color: #f5f5f7; }
  </style>
</head>
<body>
  <canvas id="stars" width="1200" height="630"></canvas>
  <div class="planet"></div>
  <div class="content">
    <p class="eyebrow">Hello, I’m</p>
    <h1><span>Enes</span><span>Mercan</span></h1>
    <p class="role">Spacecraft Electronics Design Engineer</p>
  </div>
  <div class="chips">
    <span class="chip"><strong>6</strong>spacecraft in orbit</span>
    <span class="chip"><strong>3+</strong>years in the space industry</span>
  </div>
  <div class="url">ENESMERCAN.COM</div>
  <script>
    // Deterministic star field (same image every time it's rendered)
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const ctx = document.getElementById('stars').getContext('2d');
    for (let i = 0; i < 260; i++) {
      const z = Math.pow(rand(), 1.8);
      const r = 0.5 + z * 1.4;
      ctx.globalAlpha = 0.25 + z * 0.7;
      ctx.fillStyle = '#fff';
      ctx.fillRect(rand() * 1200, rand() * 630, r, r);
    }
  </script>
</body>
</html>
